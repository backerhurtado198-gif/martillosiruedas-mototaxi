<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporación Martillos & Ruedas - Intro</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .video-container { width: 360px; height: 92vh; max-height: 750px; display: flex; justify-content: center; align-items: center; position: relative; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.9); background: #121212; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .skip-btn { position: absolute; bottom: 20px; right: 20px; background: rgba(255, 183, 3, 0.95); color: #000; padding: 8px 16px; border-radius: 6px; font-weight: bold; text-decoration: none; font-family: sans-serif; z-index: 10; cursor: pointer; border: none; font-size: 13px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .skip-btn:hover { background: #ffc107; }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="introVideo" autoplay muted playsinline onended="window.location.href='/login'">
            <source src="{{ url_for('static', filename='intro.mp4') }}" type="video/mp4">
            Tu navegador no soporta videos.
        </video>
        <a href="/login" class="skip-btn">Saltar ➔</a>
    </div>
</body>
</html>
